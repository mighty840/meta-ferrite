# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ferrite"
BBFILE_PATTERN_ferrite = "^${LAYERDIR}/"
BBFILE_PRIORITY_ferrite = "6"

LAYERVERSION_ferrite = "1"
LAYERDEPENDS_ferrite = "core"
# ferrite-sdk needs Rust >= 1.85 (see recipes-ferrite/include/ferrite-sdk.inc).
# Scarthgap ships 1.75; the Yocto Project's meta-lts-mixins layer
# (branch scarthgap/rust) provides a current toolchain.
LAYERRECOMMENDS_ferrite = "scarthgap-rust-mixin"
LAYERSERIES_COMPAT_ferrite = "scarthgap"
